<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatório de Pontualidade - Marcos Contabilidade</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js for interactive charts -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        :root {
            --primary-color: #d94747; /* Red from the logo */
            --light-bg: #f4f4f5;
            --text-dark: #18181b;
            --success-color: #16a34a;
            --late-color: #dc2626;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--light-bg);
            color: var(--text-dark);
        }
        .card {
            background-color: white;
            border-radius: 0.75rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
            border: 1px solid #e5e7eb;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .tab-button {
            padding: 0.75rem 1rem;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            font-weight: 600;
            color: #4b5563;
            transition: color 0.2s, border-color 0.2s;
            white-space: nowrap;
        }
        .tab-button.active {
            color: var(--primary-color);
            border-bottom-color: var(--primary-color);
        }
        .view-content { display: none; }
        .view-content.active { display: block; }
        .table-auto th {
            text-align: left;
            padding: 0.75rem 1rem;
            background-color: #f9fafb;
            font-size: 0.875rem;
            color: #374151;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .table-auto td { padding: 0.75rem 1rem; border-bottom: 1px solid #e5e7eb; }
        .badge { display: inline-block; padding: 0.25em 0.6em; font-size: 0.75rem; font-weight: 600; line-height: 1; text-align: center; white-space: nowrap; vertical-align: baseline; border-radius: 0.375rem; }
        .status-Atrasado { background-color: #fee2e2; color: #b91c1c; }
        .status-Adiantado { background-color: #dcfce7; color: #166534; }
        .status-No-Horário { background-color: #f3f4f6; color: #4b5563; }
        .annual-kpi { text-align: center; }
        .annual-kpi .kpi-value { font-size: 1.75rem; font-weight: 700; color: #1e293b; line-height: 1.2; }
        .annual-kpi .kpi-label { font-size: 0.8rem; color: #64748b; margin-top: 0.25rem; }
        .heat-table th, .heat-table td { padding: 0.5rem 0.6rem; text-align: center; white-space: nowrap; font-size: 0.85rem; }
        .heat-table th:first-child, .heat-table td:first-child { text-align: left; position: sticky; left: 0; background: white; z-index: 1; }
        .heat-table thead th:first-child { background: #f9fafb; }
        .heat-table td { border-bottom: 1px solid #e5e7eb; }
        .heat-table tr.total-row td { font-weight: 700; background: #f9fafb; }
        #validation-section .grid {
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        }
    </style>
</head>
<body class="p-4 sm:p-6 lg:p-8">
    <div class="max-w-7xl mx-auto">

        <header class="flex flex-col sm:flex-row items-center justify-between mb-8">
             <div class="flex items-center space-x-4">
                <img src="https://i.postimg.cc/QVzDwYPQ/2.png" alt="Marcos Contabilidade Logo" class="h-12" onerror="this.style.display='none'">
                <h1 class="text-2xl md:text-3xl font-bold text-slate-800">Relatório de Pontualidade</h1>
            </div>
            <div class="mt-4 sm:mt-0">
                <label for="month-selector" class="block text-sm font-medium text-gray-700 mb-2">Selecionar Mês:</label>
                <select id="month-selector" class="px-4 py-2 border border-gray-300 rounded-md bg-white text-gray-900 focus:ring-2 focus:ring-red-500 focus:border-red-500">
                </select>
            </div>
        </header>

        <!-- Tabs -->
        <div class="border-b border-gray-200 mb-6">
            <nav class="-mb-px flex space-x-2 sm:space-x-4 overflow-x-auto" aria-label="Tabs">
                <button class="tab-button active" data-tab="view-geral">Visão Geral</button>
                <button class="tab-button" data-tab="view-annual">Resumo Anual</button>
                <button class="tab-button" data-tab="view-department">Por Departamento</button>
                <button class="tab-button" data-tab="view-ranking">Ranking de Atrasos</button>
                <button class="tab-button" data-tab="view-individual">Visão Individual</button>
                <button class="tab-button" data-tab="view-validation">Validação dos Dados</button>
            </nav>
        </div>

        <div id="view-geral" class="view-content active"></div>
        <div id="view-annual" class="view-content"></div>
        <div id="view-department" class="view-content"></div>
        <div id="view-ranking" class="view-content"></div>
        <div id="view-individual" class="view-content"></div>
        <div id="view-validation" class="view-content"></div>
    </div>

            // Month selection data
            const availableMonths = {};

            Object.assign(availableMonths, extractedMonthsData);

            // Meses em ordem de calendário; o relatório abre no mês mais recente
            const monthKeys = Object.keys(availableMonths).sort();
            let currentMonth = monthKeys[monthKeys.length - 1];

            // Resumo anual: todos os meses lançados do ano mais recente
            const ANNUAL_KEY = 'ANUAL';
            const MONTH_ABBR = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];
            const monthShort = key => MONTH_ABBR[parseInt(key.split('-')[1], 10) - 1];
            const annualYear = currentMonth.split('-')[0];
            const annualMonthKeys = monthKeys.filter(key => key.startsWith(annualYear));
            const annualPeriodLabel = annualMonthKeys.length > 1
                ? `${monthShort(annualMonthKeys[0])} a ${monthShort(annualMonthKeys[annualMonthKeys.length - 1])} ${annualYear}`
                : `${monthShort(annualMonthKeys[0])} ${annualYear}`;

            // Junta os meses num só conjunto. Cada registro leva o horário previsto
            // do mês/dia em que foi lançado, porque o horário pode mudar ao longo do ano.
            function buildAnnualData(keys) {
                const merged = {};
                keys.forEach(key => {
                    const monthData = availableMonths[key].data;
                    for (const name in monthData) {
                        const emp = monthData[name];
                        if (!merged[name]) merged[name] = { records: [] };
                        Object.assign(merged[name], {
                            department: emp.department,
                            sheetNumber: emp.sheetNumber,
                            scheduledEntryTime: emp.scheduledEntryTime,
                            scheduledLeaveTime: emp.scheduledLeaveTime,
                            weeklySchedule: emp.weeklySchedule
                        });
                        (emp.records || []).forEach(record => {
                            const dayOfWeek = parseDate(record.date).getUTCDay();
                            const daySchedule = emp.weeklySchedule && emp.weeklySchedule[dayOfWeek];
                            merged[name].records.push(Object.assign({}, record, {
                                schedEntry: daySchedule ? daySchedule.entry : emp.scheduledEntryTime,
                                schedLeave: daySchedule ? daySchedule.leave : emp.scheduledLeaveTime
                            }));
                        });
                    }
                });
                return merged;
            }
            availableMonths[ANNUAL_KEY] = {
                name: `Acumulado ${annualPeriodLabel}`,
                data: buildAnnualData(annualMonthKeys)
            };

            document.getElementById('month-selector').innerHTML = monthKeys
                .map(key => `<option value="${key}"${key === currentMonth ? ' selected' : ''}>${availableMonths[key].name}</option>`).join('')
                + `<option disabled>──────────</option><option value="${ANNUAL_KEY}">${availableMonths[ANNUAL_KEY].name}</option>`;

            let currentEmployeesData = availableMonths[currentMonth].data;


            let activeCharts = {};

            function destroyChart(canvasId) {
                if (activeCharts[canvasId]) {
                    activeCharts[canvasId].destroy();
                    delete activeCharts[canvasId];
                }
            }
            
            function parseDate(dateString) {
                const parts = dateString.split('-');
                return new Date(Date.UTC(parts[0], parseInt(parts[1], 10) - 1, parts[2]));
            }

            function isValidTime(timeStr) {
                if (typeof timeStr !== 'string') return false;
                return /^\s*\d{1,2}:\d{2}/.test(timeStr.trim());
            }

            function parseTime(timeStr) {
                const cleanTime = timeStr.replace(/[^\d:]/g, '').trim();
                const [hours, minutes] = cleanTime.split(':').map(Number);
                return (hours * 60) + (minutes || 0);
            }
            
            function processData(employeesData = currentEmployeesData) {
                let processed = [];
                for (const employeeName in employeesData) {
                    const employeeData = employeesData[employeeName];
                    if (!employeeData.records || !employeeData.scheduledEntryTime || !employeeData.scheduledLeaveTime) continue;

                    const defaultEntryMinutes = parseTime(employeeData.scheduledEntryTime);
                    const defaultLeaveMinutes = parseTime(employeeData.scheduledLeaveTime);

                    employeeData.records.forEach(record => {
                        if (!isValidTime(record.ent1) || record.ent1.trim() === '0:00') return;
                        
                        const dateObj = parseDate(record.date);
                        const dayOfWeek = dateObj.getUTCDay();
                        if (dayOfWeek === 6 || dayOfWeek === 0) return; // Skip Saturday and Sunday

                        // Horário do dia da semana, quando o funcionário tem horário diferente em algum dia
                        const daySchedule = employeeData.weeklySchedule && employeeData.weeklySchedule[dayOfWeek];
                        const scheduledEntryMinutes = record.schedEntry ? parseTime(record.schedEntry)
                            : daySchedule ? parseTime(daySchedule.entry) : defaultEntryMinutes;
                        const scheduledLeaveMinutes = record.schedLeave ? parseTime(record.schedLeave)
                            : daySchedule ? parseTime(daySchedule.leave) : defaultLeaveMinutes;

                        const actualEntryMinutes = parseTime(record.ent1);
                        const arrivalDifference = actualEntryMinutes - scheduledEntryMinutes;

                        let arrivalStatus;
                        if (arrivalDifference > 5) arrivalStatus = 'Atrasado';
                        else if (arrivalDifference < -5) arrivalStatus = 'Adiantado';
                        else arrivalStatus = 'No Horário';

                        let leaveDifference = 0;
                        if (isValidTime(record.sai2)) {
                            const actualLeaveMinutes = parseTime(record.sai2);
                            leaveDifference = actualLeaveMinutes - scheduledLeaveMinutes;
                        }
                        
                        processed.push({
                            employeeName,
                            monthKey: record.date.slice(0, 7),
                            department: employeeData.department,
                            dateObj,
                            formattedDate: dateObj.toLocaleDateString('pt-BR', {timeZone: 'UTC'}),
                            entryTime: record.ent1,
                            leaveTime: record.sai2,
                            arrivalDifference,
                            arrivalStatus,
                            leaveDifference
                        });
                    });
                }
                return processed;
            }
            


            function renderGeneralView() {

                const container = document.getElementById('view-geral');
                container.innerHTML = `

                            <div class="h-64 sm:h-72"><canvas id="geral-bar-chart"></canvas></div>
                            <p class="text-xs text-center text-slate-500 mt-2">Média de minutos de todos os funcionários por ${currentMonth === ANNUAL_KEY ? 'mês' : 'dia'}.</p>
                        </div>
                    </div>
                    <div class="card">
                        <h2 class="text-xl font-semibold text-slate-700 mb-4">Todos os Registros de Entrada</h2>
                        <div class="overflow-x-auto">
                            <table class="w-full table-auto border-collapse">
                                <thead><tr><th>Data</th><th>Funcionário(a)</th><th>Horário Registrado</th><th>Status</th><th>Diferença (min)</th></tr></thead>
                                <tbody id="geral-table-body"></tbody>
                            </table>
                        </div>
                    </div>`;
                
                const arrivalStatusCounts = data.reduce((acc, rec) => {
                    acc[rec.arrivalStatus] = (acc[rec.arrivalStatus] || 0) + 1;
                    return acc;
                }, {});

                destroyChart('geral-pie-chart');
                
                // Map colors correctly to status
                const statusLabels = Object.keys(arrivalStatusCounts);
                const statusColors = statusLabels.map(status => {
                    if (status === 'Atrasado') return '#ef4444'; // Red
                    if (status === 'No Horário') return '#22c55e'; // Green
                    if (status === 'Adiantado') return '#eab308'; // Yellow
                    return '#6b7280'; // Gray fallback
                });
                
                activeCharts['geral-pie-chart'] = new Chart(document.getElementById('geral-pie-chart'), { type: 'doughnut', data: { labels: statusLabels, datasets: [{ data: Object.values(arrivalStatusCounts), backgroundColor: statusColors }] }, options: { responsive: true, maintainAspectRatio: false } });
                
                const totalRecords = data.length;
                const onTimeCount = (arrivalStatusCounts['Adiantado'] || 0) + (arrivalStatusCounts['No Horário'] || 0);
                const lateCount = arrivalStatusCounts['Atrasado'] || 0;
                const onTimePercentage = totalRecords > 0 ? ((onTimeCount / totalRecords) * 100).toFixed(1) : 0;
                const latePercentage = totalRecords > 0 ? ((lateCount / totalRecords) * 100).toFixed(1) : 0;
                
                document.getElementById('geral-percentage-summary').innerHTML = `

                `;

                 const isAnnual = currentMonth === ANNUAL_KEY;
                 const groupKey = rec => isAnnual ? rec.monthKey : rec.formattedDate;
                 const dailyAverages = data.reduce((acc, rec) => {
                    const key = groupKey(rec);
                    if (!acc[key]) {
                        acc[key] = { totalDifference: 0, count: 0 };
                    }
                    acc[key].totalDifference += rec.arrivalDifference;
                    acc[key].count++;
                    return acc;
                }, {});

                const sortedDates = isAnnual ? Object.keys(dailyAverages).sort() : Object.keys(dailyAverages).sort((a, b) => {
                    const [dayA, monthA, yearA] = a.split('/');
                    const [dayB, monthB, yearB] = b.split('/');
                    return new Date(`${yearA}-${monthA}-${dayA}`) - new Date(`${yearB}-${monthB}-${dayB}`);
                });

                const barChartLabels = isAnnual ? sortedDates.map(monthShort) : sortedDates;
                const barChartData = sortedDates.map(date => dailyAverages[date].totalDifference / dailyAverages[date].count);

                destroyChart('geral-bar-chart');
                activeCharts['geral-bar-chart'] = new Chart(document.getElementById('geral-bar-chart'), {
                    type: 'bar',
                    data: {
                        labels: barChartLabels,
                        datasets: [{
                            label: 'Média de Minutos',
                            data: barChartData,
                            backgroundColor: barChartData.map(avg => avg > 5 ? '#ef4444' : '#22c55e')
                        }]
                    },
                    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { title: { display: true, text: 'Minutos de Atraso/Adiantamento' } } } }
                });

                const tableBody = document.getElementById('geral-table-body');
                tableBody.innerHTML = data.sort((a,b) => a.dateObj - b.dateObj).map(rec => `<tr><td>${rec.formattedDate}</td><td>${rec.employeeName}</td><td>${rec.entryTime}</td><td><span class="badge status-${rec.arrivalStatus.replace(' ', '-')}">${rec.arrivalStatus}</span></td><td>${rec.arrivalDifference}</td></tr>`).join('');

                        // Contar atrasos

                            employeeStats[rec.employeeName].delayCount++;
                            employeeStats[rec.employeeName].delayTotalMinutes += Math.abs(rec.arrivalDifference);

                        // Contar expediente superior (mais que 5 minutos)

            // --- Resumo Anual ---
            function summarize(records) {
                const s = { total: records.length, late: 0, lateMinutes: 0, extraMinutes: 0, employees: new Set() };
                records.forEach(rec => {
                    s.employees.add(rec.employeeName);
                    if (rec.arrivalStatus === 'Atrasado') { s.late++; s.lateMinutes += rec.arrivalDifference; }
                    if (rec.leaveDifference > 5) s.extraMinutes += rec.leaveDifference;
                });
                s.latePct = s.total ? (s.late / s.total) * 100 : 0;
                s.onTimePct = s.total ? 100 - s.latePct : 0;
                s.lateAvg = s.late ? s.lateMinutes / s.late : 0;
                return s;
            }

            const fmtPct = v => `${v.toFixed(1).replace('.', ',')}%`;
            const fmtHours = minutes => {
                const m = Math.round(minutes);
                return `${Math.floor(m / 60)}h${String(m % 60).padStart(2, '0')}`;
            };
            // Escala de um só tom (vermelho claro -> escuro) para a intensidade dos atrasos
            const HEAT_STEPS = ['#ffffff', '#fef2f2', '#fee2e2', '#fecaca', '#fca5a5', '#f87171', '#ef4444', '#dc2626'];
            function heatStyle(value, max) {
                if (!value || !max) return '';
                const step = Math.min(HEAT_STEPS.length - 1, Math.max(1, Math.ceil((value / max) * (HEAT_STEPS.length - 1))));
                const color = step >= 6 ? '#ffffff' : '#1e293b';
                return `background:${HEAT_STEPS[step]};color:${color};`;
            }

                    </div>

                    <div class="card">
                        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-1">
                            <h2 class="text-xl font-semibold text-slate-700">Atrasos por Funcionário(a)</h2>
                            <select id="annual-dept-filter" class="px-3 py-2 border border-gray-300 rounded-md bg-white text-sm"></select>
                        </div>
                        <p class="text-xs text-slate-500 mb-4">Quantidade de entradas com atraso em cada mês. "—" = sem entradas registradas no mês (ainda não admitido(a), férias, licença etc.).</p>
                        <div class="overflow-x-auto"><table class="w-full heat-table" id="annual-employee-table"></table></div>
                    </div>`;

                // Gráfico: % de atraso por mês (uma série, sem legenda; a média anual como referência)
                destroyChart('annual-late-chart');
                activeCharts['annual-late-chart'] = new Chart(document.getElementById('annual-late-chart'), {
                    type: 'bar',
                    data: {
                        labels: monthly.map(m => monthShort(m.key)),
                        datasets: [
                            {
                                type: 'line', label: 'Média do ano', data: monthly.map(() => +year.latePct.toFixed(1)),
                                borderColor: '#64748b', borderWidth: 2, borderDash: [6, 4], pointRadius: 0, pointHitRadius: 0, fill: false
                            },
                            {
                                label: '% com atraso', data: monthly.map(m => +m.stats.latePct.toFixed(1)),
                                backgroundColor: '#ef4444', hoverBackgroundColor: '#dc2626', borderRadius: 4, maxBarThickness: 48
                            }
                        ]
                    },
                    options: {
                        responsive: true, maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false },
                            tooltip: {
                                filter: item => item.datasetIndex === 1,
                                callbacks: {
                                    title: items => availableMonths[monthly[items[0].dataIndex].key].name,
                                    label: item => {
                                        const s = monthly[item.dataIndex].stats;
                                        return [`${fmtPct(s.latePct)} com atraso`, `${s.late} de ${s.total} entradas`, `Média do ano: ${fmtPct(year.latePct)}`];
                                    }
                                }
                            }
                        },
                        scales: {
                            y: { beginAtZero: true, suggestedMax: 60, ticks: { callback: v => v + '%' }, grid: { color: '#f1f5f9' } },
                            x: { grid: { display: false } }
                        }
                    }
                });

                // Departamento x mês
                const departments = [...new Set(allRecords.map(r => r.department || 'Sem Departamento'))].filter(d => d !== 'GERAL').sort();
                const deptCell = (records) => {
                    const s = summarize(records);
                    if (!s.total) return '<td class="text-slate-400">—</td>';
                    return `<td style="${heatStyle(s.latePct, 100)}" title="${s.late} de ${s.total} entradas com atraso">${fmtPct(s.latePct)}</td>`;
                };
                document.getElementById('annual-dept-table').innerHTML = `
                    <thead><tr><th>Departamento</th>${monthly.map(m => `<th>${monthShort(m.key)}</th>`).join('')}<th>Ano</th></tr></thead>
                    <tbody>
                        ${departments.map(dept => `<tr><td>${dept.replace('DEPARTAMENTO ', '')}</td>
                            ${monthly.map(m => deptCell(m.records.filter(r => (r.department || 'Sem Departamento') === dept))).join('')}
                            ${deptCell(allRecords.filter(r => (r.department || 'Sem Departamento') === dept))}</tr>`).join('')}
                        <tr class="total-row"><td>Todos</td>${monthly.map(m => deptCell(m.records)).join('')}${deptCell(allRecords)}</tr>
                    </tbody>`;

                // Funcionário x mês
                const employeeDept = {};
                annualMonthKeys.forEach(key => {
                    const md = availableMonths[key].data;
                    for (const name in md) employeeDept[name] = md[name].department || 'Sem Departamento';
                });
                const deptFilter = document.getElementById('annual-dept-filter');
                const allDepts = [...new Set(Object.values(employeeDept))].filter(d => d !== 'GERAL').sort();
                deptFilter.innerHTML = `<option value="">Todos os departamentos</option>` +
                    allDepts.map(d => `<option value="${d}">${d.replace('DEPARTAMENTO ', '')}</option>`).join('');

                const renderEmployeeTable = () => {
                    const filter = deptFilter.value;
                    const rows = Object.keys(employeeDept)
                        .filter(name => employeeDept[name] !== 'GERAL' && (!filter || employeeDept[name] === filter))
                        .map(name => {
                            const perMonth = monthly.map(m => summarize(m.records.filter(r => r.employeeName === name)));
                            const total = summarize(allRecords.filter(r => r.employeeName === name));
                            return { name, perMonth, total };
                        })
                        .sort((a, b) => b.total.late - a.total.late || b.total.latePct - a.total.latePct || a.name.localeCompare(b.name));
                    const maxLate = Math.max(1, ...rows.flatMap(r => r.perMonth.map(s => s.late)));
                    document.getElementById('annual-employee-table').innerHTML = `
                        <thead><tr><th>Funcionário(a)</th>${monthly.map(m => `<th>${monthShort(m.key)}</th>`).join('')}<th>Atrasos no ano</th><th>% com atraso</th><th>Atraso médio</th><th>Total atrasos</th></tr></thead>
                        <tbody>
                            ${rows.map(r => `<tr>
                                <td>${r.name}<div class="text-xs text-slate-400">${employeeDept[r.name].replace('DEPARTAMENTO ', '')}</div></td>
                                ${r.perMonth.map(s => s.total
                                    ? `<td style="${heatStyle(s.late, maxLate)}" title="${s.late} de ${s.total} entradas com atraso">${s.late}</td>`
                                    : '<td class="text-slate-400">—</td>').join('')}
                                <td class="font-bold">${r.total.total ? r.total.late : '—'}</td>
                                <td>${r.total.total ? fmtPct(r.total.latePct) : '—'}</td>
                                <td>${r.total.late ? Math.round(r.total.lateAvg) + ' min' : '—'}</td>
                                <td>${r.total.late ? fmtHours(r.total.lateMinutes) : '—'}</td>
                            </tr>`).join('')}
                        </tbody>`;
                };
                deptFilter.addEventListener('change', renderEmployeeTable);
                renderEmployeeTable();
            }

            // --- Main Execution ---
            const tabs = document.querySelectorAll('.tab-button');
            const views = document.querySelectorAll('.view-content');

            function switchTab(tabId) {
                views.forEach(view => view.classList.toggle('active', view.id === tabId));
                tabs.forEach(tab => tab.classList.toggle('active', tab.dataset.tab === tabId));
            }

            function refreshAllViews() {
                renderGeneralView();
                renderAnnualView();
                renderDepartmentView();
                renderRankingView();
                renderIndividualView();
                renderValidationView();
            }

            // Month selector functionality
            const monthSelector = document.getElementById('month-selector');
            monthSelector.addEventListener('change', (e) => {
                currentMonth = e.target.value;
                currentEmployeesData = availableMonths[currentMonth].data;
                refreshAllViews();
            });

            tabs.forEach(tab => {
                tab.addEventListener('click', (e) => switchTab(e.target.dataset.tab));
            });

            // Initial render of all tabs
            refreshAllViews();
        });
    </script>
</body>
</html>
